<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pulse-dot { animation: pulse 2s infinite ease-in-out; }
      .candle-live { animation: tick 2.4s infinite ease-in-out; transform-origin: center 145px; }
      .price-line { animation: priceMove 2.4s infinite ease-in-out; }
      .cursor-blink { animation: blink 1.1s infinite step-end; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes tick {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.22); }
      }
      @keyframes priceMove {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect x="2" y="2" width="896" height="256" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <rect x="2" y="2" width="896" height="36" rx="12" fill="#161b22"/>
  <rect x="2" y="26" width="896" height="12" fill="#161b22"/>
  <line x1="2" y1="38" x2="898" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="20" r="5.5" fill="#27c93f"/>
  <text x="80" y="24" fill="#8b949e" font-size="11.5" class="mono">dmrusoff@mia-core ~ telemetry --live</text>

  <!-- Live Status Indicator -->
  <circle cx="758" cy="20" r="4.5" fill="#10b981" class="pulse-dot" filter="url(#glow)"/>
  <text x="770" y="24" fill="#10b981" font-size="11" font-weight="bold" class="mono">ALL SYSTEMS NOMINAL</text>

  <!-- ================= PANEL 1: ALGORITHMIC EXECUTION & ORDERFLOW ================= -->
  <rect x="18" y="50" width="280" height="192" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="72" fill="#00f2ff" font-size="11.5" font-weight="bold" class="mono">📈 ALGORITHMIC EXECUTION</text>
  <text x="235" y="72" fill="#10b981" font-size="10.5" class="mono">NT8 / C#</text>

  <!-- Subtle Chart Grid -->
  <line x1="30" y1="95" x2="285" y2="95" stroke="#161b22" stroke-width="1"/>
  <line x1="30" y1="130" x2="285" y2="130" stroke="#161b22" stroke-width="1"/>
  <line x1="30" y1="165" x2="285" y2="165" stroke="#161b22" stroke-width="1"/>
  <line x1="30" y1="200" x2="285" y2="200" stroke="#161b22" stroke-width="1"/>

  <!-- Area under Moving Average -->
  <path d="M 38 180 Q 90 165, 130 148 T 220 120 L 265 105 L 265 215 L 38 215 Z" fill="url(#cyanGlow)"/>
  <!-- Moving Average Curve -->
  <path d="M 38 180 Q 90 165, 130 148 T 220 120 L 265 105" fill="none" stroke="#00f2ff" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- Candlesticks -->
  <!-- C1 Green -->
  <line x1="45" y1="162" x2="45" y2="198" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="170" width="10" height="20" rx="1.5" fill="#10b981"/>
  <!-- C2 Green -->
  <line x1="68" y1="148" x2="68" y2="182" stroke="#10b981" stroke-width="1.5"/>
  <rect x="63" y="155" width="10" height="18" rx="1.5" fill="#10b981"/>
  <!-- C3 Red -->
  <line x1="91" y1="152" x2="91" y2="186" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="86" y="160" width="10" height="16" rx="1.5" fill="#f43f5e"/>
  <!-- C4 Green -->
  <line x1="114" y1="135" x2="114" y2="174" stroke="#10b981" stroke-width="1.5"/>
  <rect x="109" y="142" width="10" height="24" rx="1.5" fill="#10b981"/>
  <!-- C5 Green -->
  <line x1="137" y1="122" x2="137" y2="155" stroke="#10b981" stroke-width="1.5"/>
  <rect x="132" y="128" width="10" height="18" rx="1.5" fill="#10b981"/>
  <!-- C6 Red -->
  <line x1="160" y1="126" x2="160" y2="158" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="155" y="132" width="10" height="15" rx="1.5" fill="#f43f5e"/>
  <!-- C7 Green -->
  <line x1="183" y1="110" x2="183" y2="148" stroke="#10b981" stroke-width="1.5"/>
  <rect x="178" y="116" width="10" height="22" rx="1.5" fill="#10b981"/>
  <!-- C8 Green -->
  <line x1="206" y1="98" x2="206" y2="132" stroke="#10b981" stroke-width="1.5"/>
  <rect x="201" y="105" width="10" height="18" rx="1.5" fill="#10b981"/>
  <!-- C9 Live Ticking Candle -->
  <g class="candle-live">
    <line x1="232" y1="86" x2="232" y2="126" stroke="#00f2ff" stroke-width="1.8"/>
    <rect x="226" y="94" width="12" height="20" rx="1.5" fill="#00f2ff" filter="url(#glow)"/>
  </g>

  <!-- Live Price Line -->
  <g class="price-line">
    <line x1="30" y1="98" x2="250" y2="98" stroke="#00f2ff" stroke-width="1" stroke-dasharray="2,3"/>
    <rect x="246" y="89" width="42" height="16" rx="3" fill="#00f2ff"/>
    <text x="251" y="100" fill="#0d1117" font-size="9.5" font-weight="bold" class="mono">LIVE</text>
  </g>

  <text x="32" y="228" fill="#8b949e" font-size="10.5" class="mono">DELTA: <tspan fill="#10b981">+1,420</tspan>  •  RISK: <tspan fill="#00f2ff">AUTO</tspan></text>

  <!-- ================= PANEL 2: ZERO-TRUST & DAEMON TOPOLOGY ================= -->
  <rect x="310" y="50" width="280" height="192" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="324" y="72" fill="#a855f7" font-size="11.5" font-weight="bold" class="mono">🛡️ INFRASTRUCTURE &amp; DAEMONS</text>

  <!-- Topology Lines -->
  <path id="link1" d="M 375 110 L 525 110" stroke="#30363d" stroke-width="2" fill="none"/>
  <path id="link2" d="M 375 110 L 375 185" stroke="#30363d" stroke-width="2" fill="none"/>
  <path id="link3" d="M 525 110 L 525 185" stroke="#30363d" stroke-width="2" fill="none"/>
  <path id="link4" d="M 375 185 L 525 185" stroke="#30363d" stroke-width="2" fill="none"/>
  <path id="linkDiag" d="M 375 110 L 525 185" stroke="#21262d" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <!-- Animated Data Packets -->
  <circle r="3.5" fill="#00f2ff" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 375 110 L 525 110 L 525 185 L 375 185 Z"/>
  </circle>
  <circle r="3.5" fill="#10b981" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 525 185 L 375 110 L 375 185 L 525 185"/>
  </circle>

  <!-- Node 1: Carrier / Zero-Trust -->
  <rect x="326" y="92" width="102" height="36" rx="6" fill="#161b22" stroke="#00f2ff" stroke-width="1.2"/>
  <text x="336" y="108" fill="#e6edf3" font-size="10" font-weight="bold" class="mono">ZERO-TRUST</text>
  <text x="336" y="121" fill="#8b949e" font-size="9" class="mono">CCNP • Mesh VPN</text>

  <!-- Node 2: Cloud & Virtualization -->
  <rect x="472" y="92" width="104" height="36" rx="6" fill="#161b22" stroke="#a855f7" stroke-width="1.2"/>
  <text x="482" y="108" fill="#e6edf3" font-size="10" font-weight="bold" class="mono">HYBRID CLOUD</text>
  <text x="482" y="121" fill="#8b949e" font-size="9" class="mono">AWS • GCP • VCP</text>

  <!-- Node 3: Watcher Daemon -->
  <rect x="326" y="167" width="102" height="36" rx="6" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
  <text x="336" y="183" fill="#e6edf3" font-size="10" font-weight="bold" class="mono">BOT FLEET</text>
  <text x="336" y="196" fill="#10b981" font-size="9" class="mono">Watcher • 30s</text>

  <!-- Node 4: Smart Home / IoT -->
  <rect x="472" y="167" width="104" height="36" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="482" y="183" fill="#e6edf3" font-size="10" font-weight="bold" class="mono">SMART HOME</text>
  <text x="482" y="196" fill="#8b949e" font-size="9" class="mono">HA • HomeKit</text>

  <text x="324" y="228" fill="#8b949e" font-size="10.5" class="mono">MESH: <tspan fill="#10b981">ENCRYPTED</tspan> • PROBE: <tspan fill="#00f2ff">30s</tspan></text>

  <!-- ================= PANEL 3: SYSTEM METRICS & TELEMETRY ================= -->
  <rect x="602" y="50" width="280" height="192" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="616" y="72" fill="#10b981" font-size="11.5" font-weight="bold" class="mono">⚡ ENGINEERING TELEMETRY</text>

  <!-- Metric 1 -->
  <text x="616" y="98" fill="#c9d1d9" font-size="10.5" class="mono">Enterprise Infra &amp; Sec</text>
  <text x="820" y="98" fill="#00f2ff" font-size="10.5" font-weight="bold" class="mono">15+ YRS</text>
  <rect x="616" y="104" width="250" height="6" rx="3" fill="#161b22"/>
  <rect x="616" y="104" width="250" height="6" rx="3" fill="url(#greenBar)"/>

  <!-- Metric 2 -->
  <text x="616" y="130" fill="#c9d1d9" font-size="10.5" class="mono">Trading Systems &amp; Quant</text>
  <text x="826" y="130" fill="#00f2ff" font-size="10.5" font-weight="bold" class="mono">6+ YRS</text>
  <rect x="616" y="136" width="250" height="6" rx="3" fill="#161b22"/>
  <rect x="616" y="136" width="215" height="6" rx="3" fill="url(#greenBar)"/>

  <!-- Metric 3 -->
  <text x="616" y="162" fill="#c9d1d9" font-size="10.5" class="mono">Daemon &amp; Network Uptime</text>
  <text x="826" y="162" fill="#10b981" font-size="10.5" font-weight="bold" class="mono">99.99%</text>
  <rect x="616" y="168" width="250" height="6" rx="3" fill="#161b22"/>
  <rect x="616" y="168" width="246" height="6" rx="3" fill="url(#greenBar)"/>

  <!-- Terminal Prompt Line -->
  <rect x="616" y="186" width="250" height="44" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="626" y="203" fill="#8b949e" font-size="9.5" class="mono">$ watcher --fleet-health</text>
  <text x="626" y="220" fill="#10b981" font-size="9.5" class="mono">&gt; 5/5 daemons active</text>
  <rect x="748" y="211" width="6" height="11" fill="#00f2ff" class="cursor-blink"/>
</svg>
